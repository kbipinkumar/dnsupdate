# /etc/systemd/system/dnsupdate.timer.d/override.conf
#
# Customize the dnsupdate systemd timer interval.
# By default, dnsupdate.timer runs every 5 minutes.
#
# To install this override:
#   sudo mkdir -p /etc/systemd/system/dnsupdate.timer.d
#   sudo cp timer-interval.conf /etc/systemd/system/dnsupdate.timer.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart dnsupdate.timer
#
# Alternatively:
#   sudo systemctl edit dnsupdate.timer

[Timer]
# Reset the default 5min trigger
OnUnitActiveSec=
# Set higher interval (e.g. 15min, 30min, 1h, 6h, 1d)
OnUnitActiveSec=1h
